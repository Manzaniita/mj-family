# Verificación automática de MJ Family.
#
# PHP 7.4/8.3, reglas de WordPress, copias compartidas y builds de React.
# La documentación tiene un workflow liviano propio.
# Equivalente local: .\tools\verificar.ps1

name: Verificar

# Evita repetir los controles pesados en cambios exclusivamente Markdown,
# manifiestos generados o etiquetas. Un push mixto sí se verifica.
on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - 'releases/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'releases/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Sintaxis: lo único que no admite excepciones.
  #
  # Se prueba contra 7.4 (lo que declaran las cabeceras) y contra 8.3 (lo que
  # corren los servidores hoy). Un archivo tiene que estar bien en las dos.
  # ---------------------------------------------------------------------------
  sintaxis:
    name: Sintaxis de PHP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l sobre todos los archivos
        run: |
          rotos=0
          total=0
          while IFS= read -r f; do
            total=$((total + 1))
            if ! php -l "$f" > /dev/null 2>&1; then
              rotos=$((rotos + 1))
              echo "::error file=$f::Error de sintaxis en PHP ${{ matrix.php }}"
              php -l "$f" || true
            fi
          done < <(git ls-files --cached --others --exclude-standard '*.php')
          echo "Archivos revisados: $total"
          echo "Rotos: $rotos"
          if [ "$rotos" -ne 0 ]; then
            echo "::error::$rotos archivos no compilan en PHP ${{ matrix.php }}."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Reglas de WordPress, contra la foto de referencia.
  # ---------------------------------------------------------------------------
  reglas:
    name: Reglas de WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar PHPCS y los estándares
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Compatibilidad con PHP 7.4
        run: |
          vendor/bin/phpcs \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion 7.4- \
            --extensions=php \
            --ignore='*/vendor/*,*/node_modules/*,*/dist/*' \
            --report=full --no-colors -q \
            plugins themes

      - name: Revisar reglas
        run: |
          vendor/bin/phpcs --report=json --no-colors --report-file=phpcs.json -q || true
          php tools/phpcs-baseline.php comparar phpcs.json

      # El mismo script que en local: detecta también consumidores sin copia.
      - name: Copias de shared/ sincronizadas
        shell: pwsh
        run: ./tools/sincronizar-compartido.ps1 -Verificar

      - name: Guardar el informe completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-phpcs
          path: phpcs.json
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Que compilen las dos apps.
  # ---------------------------------------------------------------------------
  compilar:
    name: Compilar ${{ matrix.app.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - nombre: el tema
            ruta: themes/mj-appearance/react-app
          - nombre: los turnos
            ruta: plugins/mj-turnos-online/app
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app.ruta }}/package-lock.json

      # npm ci y no npm install: instala exactamente lo que dice el
      # package-lock.json, así el CI compila con las mismas versiones que la
      # máquina y no con las últimas que hayan salido hoy.
      - name: Instalar dependencias
        working-directory: ${{ matrix.app.ruta }}
        run: npm ci --no-audit --no-fund

      - name: Compilar
        working-directory: ${{ matrix.app.ruta }}
        run: npm run build

      # El dist/ se versiona a propósito (el servidor no tiene Node). Si lo
      # compilado no coincide con lo commiteado, alguien tocó el código fuente
      # y se olvidó de compilar: la tienda estaría corriendo lo viejo.
      - name: Avisar si el dist commiteado quedó viejo
        run: |
          if ! git diff --quiet -- '*/dist/*'; then
            echo "::warning::El dist/ commiteado no coincide con lo que acaba de compilar. Corré el build y commiteá el resultado."
            git diff --stat -- '*/dist/*'
          fi
