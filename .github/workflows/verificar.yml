# Verificación automática de MJ Family.
#
# Corre en cada push y en cada pull request. Es la red de seguridad que antes
# no existía: 128.000 líneas que corren en tiendas reales y ninguna forma de
# saber si un cambio las rompía hasta que un cliente escribía.
#
# Tres trabajos, del más importante al menos:
#
#   sintaxis     php -l sobre todos los .php, y compatibilidad con PHP 7.4.
#                Tolerancia cero: un error acá es una pantalla blanca.
#
#   reglas       Las reglas de WordPress (seguridad, base de datos) comparadas
#                contra tools/phpcs-baseline.json. Corta solo si hay algo nuevo:
#                los avisos viejos quedan anotados como deuda, no frenan.
#
#   compilar     Que las dos apps de React compilen. Si el build falla, mejor
#                enterarse acá que cuando vas a publicar.
#
# Lo mismo se corre en la máquina con:  .\tools\verificar.ps1

name: Verificar

# Cuándo NO corre: al publicar (el commit de publicar.ps1 solo cambia los zip
# de releases/ y el manifiesto) ni cuando solo cambia documentación. Y tampoco
# por la etiqueta de la versión: el push de la rama ya lo verificó. Sin esto,
# cada publicación disparaba dos corridas de cinco trabajos sobre código que
# ya estaba verificado, y los minutos de Actions de una cuenta privada son
# contados.
on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - 'releases/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'releases/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Sintaxis: lo único que no admite excepciones.
  #
  # Se prueba contra 7.4 (lo que declaran las cabeceras) y contra 8.3 (lo que
  # corren los servidores hoy). Un archivo tiene que estar bien en las dos.
  # ---------------------------------------------------------------------------
  sintaxis:
    name: Sintaxis de PHP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l sobre todos los archivos
        run: |
          rotos=0
          total=0
          while IFS= read -r f; do
            total=$((total + 1))
            if ! php -l "$f" > /dev/null 2>&1; then
              rotos=$((rotos + 1))
              echo "::error file=$f::Error de sintaxis en PHP ${{ matrix.php }}"
              php -l "$f" || true
            fi
          done < <(git ls-files --cached --others --exclude-standard '*.php')
          echo "Archivos revisados: $total"
          echo "Rotos: $rotos"
          if [ "$rotos" -ne 0 ]; then
            echo "::error::$rotos archivos no compilan en PHP ${{ matrix.php }}."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Reglas de WordPress, contra la foto de referencia.
  # ---------------------------------------------------------------------------
  reglas:
    name: Reglas de WordPress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Instalar PHPCS y los estándares
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Compatibilidad con PHP 7.4
        run: |
          vendor/bin/phpcs \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion 7.4- \
            --extensions=php \
            --ignore='*/vendor/*,*/node_modules/*,*/dist/*' \
            --report=full --no-colors -q \
            plugins themes

      - name: Revisar reglas
        run: |
          vendor/bin/phpcs --report=json --no-colors --report-file=phpcs.json -q || true
          php tools/phpcs-baseline.php comparar phpcs.json

      # Los archivos de shared/ se copian adentro de cada plugin para que cada
      # uno siga siendo autosuficiente. Si una copia se editó a mano, deja de
      # coincidir con la maestra y los plugins empiezan a comportarse distinto
      # entre sí. Esto lo caza acá y no en una tienda.
      - name: Copias de shared/ sincronizadas
        shell: bash
        run: |
          if [ ! -d shared ]; then
            echo "No hay archivos compartidos todavía."
            exit 0
          fi
          faltan=0
          for maestra in shared/*.php; do
            [ -e "$maestra" ] || continue
            nombre=$(basename "$maestra")
            esperado=$(sha256sum "$maestra" | cut -d' ' -f1)
            while IFS= read -r copia; do
              real=$(sha256sum "$copia" | cut -d' ' -f1)
              if [ "$real" != "$esperado" ]; then
                echo "::error file=$copia::Quedó distinto de shared/$nombre. Corré tools/sincronizar-compartido.ps1"
                faltan=$((faltan + 1))
              fi
            done < <(find plugins -path "*/compartido/$nombre")
          done
          if [ "$faltan" -ne 0 ]; then
            exit 1
          fi
          echo "Todas las copias coinciden con shared/."

      - name: Guardar el informe completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-phpcs
          path: phpcs.json
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Que compilen las dos apps.
  # ---------------------------------------------------------------------------
  compilar:
    name: Compilar ${{ matrix.app.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - nombre: el tema
            ruta: themes/mj-appearance/react-app
          - nombre: los turnos
            ruta: plugins/mj-turnos-online/app
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app.ruta }}/package-lock.json

      # npm ci y no npm install: instala exactamente lo que dice el
      # package-lock.json, así el CI compila con las mismas versiones que la
      # máquina y no con las últimas que hayan salido hoy.
      - name: Instalar dependencias
        working-directory: ${{ matrix.app.ruta }}
        run: npm ci --no-audit --no-fund

      - name: Compilar
        working-directory: ${{ matrix.app.ruta }}
        run: npm run build

      # El dist/ se versiona a propósito (el servidor no tiene Node). Si lo
      # compilado no coincide con lo commiteado, alguien tocó el código fuente
      # y se olvidó de compilar: la tienda estaría corriendo lo viejo.
      - name: Avisar si el dist commiteado quedó viejo
        run: |
          if ! git diff --quiet -- '*/dist/*'; then
            echo "::warning::El dist/ commiteado no coincide con lo que acaba de compilar. Corré el build y commiteá el resultado."
            git diff --stat -- '*/dist/*'
          fi
